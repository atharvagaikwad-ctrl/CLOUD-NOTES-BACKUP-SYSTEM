name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Stage 1: Code Quality & Automated Tests
  test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Gate
        run: npx eslint .

      - name: Run Automated Test Suite (node:test)
        run: npm test

  # Stage 2: Container Packaging & Health Smoke Test
  build:
    name: Docker Build & Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t cloud-notes-backup-system:latest .

      - name: Run Container & Verify Health Endpoint (Smoke Test)
        run: |
          docker run -d --name test-app -p 3000:3000 cloud-notes-backup-system:latest
          sleep 6
          curl -f http://localhost:3000/health || (docker logs test-app && exit 1)
          echo "Smoke test passed successfully! /health endpoint returned 200 OK."

  # Stage 3: Continuous Deployment to Render (Push to main only)
  deploy:
    name: Continuous Deployment (Render)
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Automated Deployment Hook
        run: |
          echo "Triggering automated release deployment on Render..."
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"
          echo "Deployment hook triggered successfully for commit ${{ github.sha }}."
